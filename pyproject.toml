[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curio-ai"
version = "0.1.0"
description = "AI that knows what it doesn't know — and learns it."
readme = "README.md"
license = "LicenseRef-Curio-Attribution"
requires-python = ">=3.10"
authors = [
    {name = "Thrilok"}
]
keywords = ["ai", "learning", "memory", "knowledge", "mcp", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
web = ["ddgs"]
llm = ["pyyaml"]
all = ["ddgs", "pyyaml"]
dev = ["ddgs", "pyyaml", "pytest"]

[project.scripts]
curio = "src.cli:main"
curio-mcp = "src.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Thrilok28021996/curio"
Documentation = "https://github.com/Thrilok28021996/curio#readme"
Repository = "https://github.com/Thrilok28021996/curio"
Issues = "https://github.com/Thrilok28021996/curio/issues"

[tool.setuptools.packages.find]
include = ["src*"]
