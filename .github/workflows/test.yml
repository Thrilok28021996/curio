name: Curio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run core tests
        run: python tests/test_core.py
      - name: Run validation tests
        run: python tests/test_validation.py
      - name: Run MCP server tests
        run: python tests/test_mcp_server.py

      # Network-dependent: queries DuckDuckGo/Yahoo. Retries and fallback
      # queries make this far more reliable, but a dead backend is not a
      # code defect, so it must not block the build. Real test failures
      # still do — the steps above have no continue-on-error.
      - name: Run benchmarks
        run: python eval/run_benchmark.py
        continue-on-error: true
