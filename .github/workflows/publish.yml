name: publish

# Publishes to PyPI via Trusted Publishing (OIDC) — no API tokens stored.
# PyPI is configured with this exact workflow path:
#   .github/workflows/publish.yml
#
# Trigger a first publish manually with workflow_dispatch (Actions tab →
# publish → Run workflow), or automatically when a GitHub Release is published.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # id-token: write is mandatory — without it GitHub issues no OIDC token
    # and pypa/gh-action-pypi-publish fails with "no identity token".
    permissions:
      id-token: write
      contents: read
    # No `environment:` key on purpose: it must match the "Environment name"
    # field on the PyPI publisher form, which is left blank.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
